name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_image:
        description: HCU image (overrides the CI_IMAGE repository variable)
        required: false
        type: string

permissions:
  contents: read
  packages: read

concurrency:
  group: triton-test-arc-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

# CI_IMAGE identifies the source archive; ARC jobs pull its verified private mirror.
# ARC must mount /ci_public as shared storage in both job containers.
jobs:
  prepare-image:
    name: Prepare private CI image from shared archive
    runs-on: hygon-build
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    container:
      image: quay.io/skopeo/stable@sha256:80b3b934549428c7c24b9364b977b1f48cb8abe8ce99f74c1f16fe15c32aa342
    outputs:
      image: ${{ steps.publish.outputs.image }}
    env:
      CI_IMAGE: ${{ inputs.ci_image || vars.CI_IMAGE }}
      CI_IMAGE_ARCHIVE_DIR: ${{ vars.CI_IMAGE_ARCHIVE_DIR || '/ci_public/ci-images/triton-inference-server-test-ci/20261111-aicc-g2f732c' }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Install checkout tools
        run: dnf install -y git-core

      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate image publication guards
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            require('node:child_process').execFileSync(process.execPath,
              ['--test', '.github/scripts/test-publish-ci-image.cjs'], {stdio: 'inherit'});

      - name: Publish or reuse private CI image
        id: publish
        uses: actions/github-script@373c709c69115d41ff229c7e5df9f8788daa9553 # v9
        with:
          script: |
            const {publish} = require('./.github/scripts/publish-ci-image.cjs');
            await publish({core, github, context});

  build:
    name: Build Triton and backends (ARC)
    needs: prepare-image
    runs-on: hygon-build
    timeout-minutes: 240
    container:
      image: ${{ needs.prepare-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      artifact_dir: ${{ steps.build.outputs.artifact_dir }}
    env:
      CI_HIP_ARCHITECTURES: ${{ vars.CI_HIP_ARCHITECTURES }}
      CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build and publish install tree
        id: build
        run: bash .github/scripts/arc-ci.sh build

      - name: Save build log
        if: always()
        run: bash .github/scripts/arc-ci.sh save-build-log

  test:
    name: Single-HCU integration tests (ARC)
    needs: [prepare-image, build]
    runs-on: hygon-bw1100-1card
    timeout-minutes: 180
    container:
      image: ${{ needs.prepare-image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    env:
      CI_ARTIFACT_DIR: ${{ needs.build.outputs.artifact_dir }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install published bindings and run tests
        run: bash .github/scripts/arc-ci.sh test

      - name: Save test logs
        if: always()
        run: bash .github/scripts/arc-ci.sh save-test-logs
