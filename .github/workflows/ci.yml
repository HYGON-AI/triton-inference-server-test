name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      ci_image:
        description: HCU image (overrides the CI_IMAGE repository variable)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: triton-test-arc-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

# CI_IMAGE must contain matching HCU build/runtime dependencies.
# ARC must mount /ci_public as shared storage in both job containers.
jobs:
  prepare-image:
    name: Prepare CI image on eligible nodes
    runs-on:
      group: ci-general
      labels: [self-hosted, ci, nmz1]
    timeout-minutes: 60
    env:
      CI_IMAGE: ${{ inputs.ci_image || vars.CI_IMAGE }}
      CI_IMAGE_ARCHIVE_DIR: ${{ vars.CI_IMAGE_ARCHIVE_DIR || '/ci_public/ci-images/triton-inference-server-test-ci/20261111-aicc-g2f732c' }}
      CI_IMAGE_NODES: ${{ vars.CI_IMAGE_NODES || '10.17.1.3 10.17.1.4' }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check or load shared CI image
        run: bash .github/scripts/prepare-ci-image.sh

  build:
    name: Build Triton and backends (ARC)
    needs: prepare-image
    runs-on: hygon-build
    timeout-minutes: 240
    container:
      image: ${{ inputs.ci_image || vars.CI_IMAGE }}
    outputs:
      artifact_dir: ${{ steps.build.outputs.artifact_dir }}
    env:
      CI_HIP_ARCHITECTURES: ${{ vars.CI_HIP_ARCHITECTURES }}
      CI_REPO_TOKEN: ${{ secrets.CI_REPO_TOKEN }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build and publish install tree
        id: build
        run: bash .github/scripts/arc-ci.sh build

      - name: Save build log
        if: always()
        run: bash .github/scripts/arc-ci.sh save-build-log

  test:
    name: Single-HCU integration tests (ARC)
    needs: build
    runs-on: hygon-bw1100-1card
    timeout-minutes: 180
    container:
      image: ${{ inputs.ci_image || vars.CI_IMAGE }}
    env:
      CI_ARTIFACT_DIR: ${{ needs.build.outputs.artifact_dir }}
    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install published bindings and run tests
        run: bash .github/scripts/arc-ci.sh test

      - name: Save test logs
        if: always()
        run: bash .github/scripts/arc-ci.sh save-test-logs
